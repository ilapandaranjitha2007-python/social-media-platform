{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Post - ConnectHub</title>

    <link rel="stylesheet"
          href="{% static 'social/style.css' %}">

</head>

<body>

<nav class="navbar">

    <div class="nav-container">

        <a href="{% url 'home' %}" class="logo">
            ConnectHub
        </a>

        <div class="nav-links">

            <a href="{% url 'home' %}">
                🏠 Home
            </a>

            <a href="{% url 'explore' %}">
                🌎 Explore
            </a>

            <a href="{% url 'profile' user.username %}">
                👤 Profile
            </a>

            <a href="{% url 'logout' %}">
                🚪 Logout
            </a>

        </div>

    </div>

</nav>


<div class="create-page">

    <div class="create-post-card">

        <div class="create-post-title">

            <h1>Create a Post</h1>

            <p>
                Share something with your ConnectHub community.
            </p>

        </div>


        <form method="POST"
              enctype="multipart/form-data">

            {% csrf_token %}


            <div class="post-author">

                <div class="big-avatar">
                    {{ user.username|first|upper }}
                </div>

                <div>
                    <strong>
                        @{{ user.username }}
                    </strong>

                    <span>
                        Public
                    </span>
                </div>

            </div>


            <textarea
                name="content"
                placeholder="What's on your mind?"
                required></textarea>


            <label class="upload-box">

                📷

                <strong>
                    Add Photo
                </strong>

                <span>
                    Click to select an image
                </span>

                <input
                    type="file"
                    name="image"
                    accept="image/*"
                >

            </label>


            <div class="create-actions">

                <a href="{% url 'home' %}">
                    Cancel
                </a>

                <button type="submit">
                    Publish Post
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
